# Global mise tools. Activated in .zshrc via `mise activate zsh`.
# Per-project overrides go into a project's mise.toml / .tool-versions.

[tools]
opentofu = "1.11.2"
terragrunt = "0.97.2"
tflint = "0.63.1"
terraform-docs = "0.21.0"
ruff = "0.16.4"
python = "3.13.15"
powershell-core = "7.5.4"
jq = "1.8.2"
databricks-cli = "1.10.0"
"ubi:glueckkanja/marinatemd" = "0.4.1"

[settings]
# read .python-version / .terraform-version etc. in projects
idiomatic_version_file_enable_tools = ["python", "opentofu", "terragrunt", "node"]
